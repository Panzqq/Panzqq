    <rect x="166" y="0" width="82" height="26" rx="5" fill="#121824" stroke="#263144" stroke-width="1"/>
    <text x="207" y="17" text-anchor="middle" fill="#E2E8F0">Supabase</text>

    <rect x="256" y="0" width="66" height="26" rx="5" fill="#121824" stroke="#263144" stroke-width="1"/>
