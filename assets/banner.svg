<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Repann (@Panzqq) - Full Stack and WhatsApp Systems Developer">
  <defs>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="55%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#10151F"/>
    </linearGradient>
    <radialGradient id="focalDepth" cx="82%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#142334" stop-opacity="0.72"/>
      <stop offset="60%" stop-color="#0B0E14" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="258" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="900" height="260" fill="url(#bgBase)"/>
    <rect x="0" y="0" width="900" height="260" fill="url(#focalDepth)"/>

    <!-- Geometric orbital telemetry motif (right focal zone, positioned clear of motto footer) -->
    <g transform="translate(744, 106)" fill="none">
      <circle r="86" stroke="#18202C" stroke-width="1"/>
      <circle r="64" stroke="#1E2838" stroke-width="1" stroke-dasharray="4 6"/>
      <circle r="42" stroke="#243247" stroke-width="1.2"/>
      <path d="M -42 0 A 42 42 0 0 1 29.7 -29.7" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <path d="M 0 -64 A 64 64 0 0 1 64 0" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>
      <line x1="-98" y1="0" x2="-52" y2="0" stroke="#1D2636" stroke-width="1"/>
      <line x1="52" y1="0" x2="98" y2="0" stroke="#1D2636" stroke-width="1"/>
      <line x1="0" y1="-92" x2="0" y2="-52" stroke="#1D2636" stroke-width="1"/>
      <line x1="0" y1="52" x2="0" y2="90" stroke="#1D2636" stroke-width="1"/>
      <polygon points="0,-14 12,0 0,14 -12,0" stroke="#38BDF8" stroke-width="1.4" fill="#0B131E"/>
      <circle cx="0" cy="0" r="3.2" fill="#38BDF8"/>
      <circle cx="29.7" cy="-29.7" r="2.8" fill="#38BDF8"/>
    </g>

    <!-- Corner registration marks -->
    <path d="M 24 22 L 38 22 M 24 22 L 24 36" stroke="#2B3548" stroke-width="1.4" fill="none"/>
    <path d="M 876 22 L 862 22 M 876 22 L 876 36" stroke="#2B3548" stroke-width="1.4" fill="none"/>

    <!-- Typography -->
    <text x="48" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.6" fill="#94A3B8">@PANZQQ  /  PURBALINGGA, INDONESIA</text>

    <text x="48" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.8" fill="#F8FAFC">Repann</text>

    <text x="48" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#CBD5E1">Full Stack &amp; WhatsApp Systems Developer</text>

    <rect x="48" y="172" width="440" height="1.5" fill="url(#accentRule)"/>

    <!-- Core runtime chips -->
    <g transform="translate(48, 194)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="76" height="28" rx="6" fill="#0F141D" stroke="#263145" stroke-width="1"/>
      <text x="38" y="18" text-anchor="middle" fill="#E2E8F0">Node.js</text>

      <rect x="86" y="0" width="98" height="28" rx="6" fill="#0F141D" stroke="#263145" stroke-width="1"/>
      <text x="135" y="18" text-anchor="middle" fill="#E2E8F0">TypeScript</text>

      <rect x="194" y="0" width="76" height="28" rx="6" fill="#0F141D" stroke="#263145" stroke-width="1"/>
      <text x="232" y="18" text-anchor="middle" fill="#E2E8F0">Next.js</text>

      <rect x="280" y="0" width="124" height="28" rx="6" fill="#0D1926" stroke="#1E4E6E" stroke-width="1"/>
      <text x="342" y="18" text-anchor="middle" fill="#7DD3FC">Baileys Engine</text>
    </g>

    <text x="852" y="218" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500" fill="#94A3B8">All Falls Down</text>
